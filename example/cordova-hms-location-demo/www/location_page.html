<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="css/index.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">

        <!-- Request Location Updates -->
        <fieldset class="mb-4">
            <legend>Request Location Updates</legend>

            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text">Request Code:</span>
                </div>
                <input id="addRequestCode" type="text" class="form-control" aria-label="Request Code">
            </div>

            <button id="requestLocationUpdates" type="button" class="btn btn-primary btn-lg btn-block mb-2">
                Request Location Updates
            </button>

            <div class="bg-light p-2 overflow-auto" style="height: 150px;">
                <label id="locationUpdateLogs"></label>
            </div>

            <button id="requestLocationUpdatesEx" type="button" class="btn btn-primary btn-lg btn-block mt-3 mb-2">
                Request Location Updates Ex
            </button>

            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text">Request Code:</span>
                </div>
                <input id="addRequestCodeEx" type="text" class="form-control" aria-label="Request Code Ex">
            </div>

            <div class="container overflow-auto mb-3">
                <label id="requestLocationUpdatesExLog"></label>
            </div>
        </fieldset>

        <!-- Get Last Known Location -->
        <fieldset class="mb-4">
            <legend>Get Last Location</legend>

            <button id="getLastLocation" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Get Last Known Location
            </button>
            <div class="container overflow-auto mb-3">
                <label id="getLastLocationLog"></label>
            </div>

            <button id="getLastLocationWithAddress" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Get Last Location With Address
            </button>
            <div class="container overflow-auto mb-3">
                <label id="getLastLocationWithAddressLog"></label>
            </div>
        </fieldset>

        <!-- Location Availability & Flush -->
        <fieldset class="mb-4">
            <legend>Availability & Flush</legend>

            <button id="getLocationAvailability" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Get Location Availability
            </button>
            <div class="container overflow-auto mb-3">
                <label id="getLocationAvailabilityLog"></label>
            </div>

            <button id="flushLocations" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Flush Locations
            </button>
            <div class="container overflow-auto mb-3">
                <label id="flushLocationsLog"></label>
            </div>
        </fieldset>

        <!-- Location Settings & Navigation Context -->
        <fieldset class="mb-4">
            <legend>Settings & Context</legend>

            <button id="checkLocationSettings" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Check Location Settings
            </button>
            <div class="container overflow-auto mb-3">
                <label id="checkLocationSettingsLog"></label>
            </div>

            <button id="getNavigationContextState" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Get Navigation Context State
            </button>
            <div class="container overflow-auto mb-3">
                <label id="getNavigationContextStateLog"></label>
            </div>
        </fieldset>

        <!-- Remove Location Updates -->
        <fieldset class="mb-4">
            <legend>Remove Location Updates</legend>

            <div class="input-group mb-2">
                <div class="input-group-prepend">
                    <label class="input-group-text" for="removeTypeSelect">Type:</label>
                </div>
                <select class="custom-select" id="removeTypeSelect">
                    <option value="pendingIntent">PENDING_INTENT</option>
                    <option value="locationCallback">LOCATION_CALLBACK</option>
                </select>
            </div>

            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text">Request Code:</span>
                </div>
                <input id="removeRequestCode" type="text" class="form-control" aria-label="Remove Request Code">
            </div>

            <button id="removeLocationUpdates" type="button" class="btn btn-primary btn-lg btn-block mb-2">
                Remove Location Updates
            </button>
            <div class="container overflow-auto mb-3">
                <label id="removeLocationUpdatesLog"></label>
            </div>
        </fieldset>

        <!-- Mock Location -->
        <fieldset class="mb-4">
            <legend>Mock Location</legend>

            <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text">Latitude and Longitude</span>
                </div>
                <input id="latitude" type="number" class="form-control" placeholder="Latitude">
                <input id="longitude" type="number" class="form-control" placeholder="Longitude">
            </div>

            <button id="setMockLocation" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Set Mock Location
            </button>
            <div class="container overflow-auto mb-3">
                <label id="setMockLocationLog"></label>
            </div>

            <div class="input-group mb-3">
                <select id="inputGroupSelect04" class="custom-select">
                    <option value="true">True</option>
                    <option value="false">False</option>
                </select>
                <div class="input-group-append">
                    <button id="setMockMode" class="btn btn-primary" type="button">Set Mock Mode</button>
                </div>
            </div>
            <div class="container overflow-auto mb-3">
                <label id="setMockModeLog"></label>
            </div>
        </fieldset>

        <!-- Background Location & Logs -->
        <fieldset class="mb-4">
            <legend>Background Location</legend>

            <button id="enableBackgroundLocation" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Enable Background Location
            </button>
            <div class="container overflow-auto mb-3">
                <label id="enableBackgroundLocationLog"></label>
            </div>

            <button id="disableBackgroundLocation" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Disable Background Location
            </button>
            <div class="container overflow-auto mb-3">
                <label id="disableBackgroundLocationLog"></label>
            </div>
        </fieldset>

        <!-- Log Config -->
        <fieldset class="mb-4">
            <legend>Log Configuration</legend>

            <button id="setLogConfig" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Set Log Config
            </button>

            <button id="getLogConfig" class="btn btn-primary btn-lg btn-block mb-2" type="button">
                Get Log Config
            </button>
            <div class="container overflow-auto mb-3">
                <label id="getLogConfigLog"></label>
            </div>
        </fieldset>
    </div>


    <script src="cordova.js"></script>
    <script src="js/util.js"></script>
    <script src="js/location.js"></script>
    <script src="js/eventListeners.js"></script>
    <script crossorigin="anonymous" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
